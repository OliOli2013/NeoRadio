name: NeoRadio 3.2.1 build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate independent HD/FHD skins
        run: python3 tools/validate_skins_3_2_1.py
      - name: Build IPK and DEB
        run: bash tools/build_release_3_2_1.sh
      - name: Verify package files
        run: |
          ar t releases/enigma2-plugin-extensions-neoradio_3.2.1_all.ipk
          dpkg-deb --info releases/enigma2-plugin-extensions-neoradio_3.2.1_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: NeoRadio-3.2.1-IPK-DEB
          path: |
            releases/enigma2-plugin-extensions-neoradio_3.2.1_all.ipk
            releases/enigma2-plugin-extensions-neoradio_3.2.1_all.deb
            releases/SHA256_3.2.1.txt
            releases/manifest_3.2.1_UPLOAD_AFTER_RELEASE.json
